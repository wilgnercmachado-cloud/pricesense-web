[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
maxUploadSize = 300

[theme]
base = "light"
primaryColor = "#2D4BFF"
backgroundColor = "#EDF1F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1220"
borderColor = "#DCE2EC"
baseRadius = "0.65rem"
buttonRadius = "0.65rem"
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap, sans-serif"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap, monospace"
