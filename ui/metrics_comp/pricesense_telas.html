<script>
/* avisa o Streamlit que o componente está pronto logo no início (antes de baixar estilos e bibliotecas) e guarda o
   primeiro pedido de desenho até o resto do arquivo carregar */
window.__psRender = null;
window.addEventListener('message', e => { if (e.data && e.data.type === 'streamlit:render') window.__psRender = e.data; });
window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1 }, '*');
</script>

  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4.5px));
  filter:drop-shadow(0 0 14px var(--primary,#2D4BFF));animation:pcg 1s linear infinite}

@keyframes pcg{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes pcv{to{transform:translate(-50%,-50%) rotate(-360deg)}}

.glass{background:var(--surface);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;flex-wrap:wrap;position:relative;z-index:30}
.top h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.top small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}

.acts .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;
  transition:transform .15s,border-color .2s,color .2s,box-shadow .2s,background .2s}
.ib svg{width:17px;height:17px}
.ib:hover{transform:translateY(-1px);border-color:var(--primary);color:var(--primary);box-shadow:0 8px 20px -12px var(--primary)}
.ib.pri{background:linear-gradient(180deg,var(--primary-hover),var(--primary));color:#fff;border-color:transparent}
.ib.gr{background:var(--up-soft);color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,transparent)}
.ib.on{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
button.tx{font:550 12.5px 'Geist',sans-serif;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.tx:hover{border-color:var(--primary);color:var(--primary)}
button.tx.pri{background:linear-gradient(180deg,var(--primary-hover),var(--primary));color:#fff;border-color:transparent}
button.tx.ok{background:var(--up);border-color:var(--up);color:#fff}
#tip{white-space:pre-line!important;max-width:420px;line-height:1.5;text-align:left;position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--canvas);font-size:11.5px;padding:5px 9px;border-radius:7px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap}
#tip.on{opacity:1;transform:none}
.pop{position:absolute;top:44px;right:0;z-index:20;width:420px;padding:14px;display:none;background:var(--surface-solid)!important;box-shadow:0 24px 48px -20px rgba(15,23,42,.45)}
.pop.on{display:block;animation:pin .18s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop h4{margin:0 0 4px;font-size:13px;font-weight:600}
.pop p{margin:0 0 10px;font-size:11.5px;color:var(--muted);line-height:1.45}
.pop table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.pop th{text-align:left;color:var(--faint);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--line)}
.pop td{padding:6px;border-bottom:1px solid var(--line)}
.pop input[type=number],.pop input[type=date],.pop select{width:100%;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:0 8px;font:12.5px 'Geist Mono',monospace}
.opt{display:flex;gap:6px;margin-bottom:10px}
.opt label{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12px}
.opt label.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.opt input{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.grid2 span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.k{padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(16px);position:relative;overflow:hidden}
.k::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--t,var(--faint)),transparent)}
.k span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500}
.k span svg{color:var(--t)}
.k b{display:block;font:500 19px 'Geist Mono',monospace;letter-spacing:-.03em;margin-top:3px;white-space:nowrap}
.k i{font-style:normal;font-size:11px;color:var(--faint);font-family:'Geist Mono',monospace}
.pos{color:var(--up)}.neg{color:var(--down)!important}


h3{margin:0 0 8px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
h3 small{color:var(--faint);font-weight:400;overflow:hidden;text-overflow:ellipsis}

.hseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.hseg button{border:0;background:transparent;color:var(--muted);font:550 11px 'Geist',sans-serif;padding:3px 10px;cursor:pointer}
.hseg button.on{background:var(--primary);color:#fff}
.hchips{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:2px;scrollbar-width:thin}
.hchip{flex:none;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--ink);text-align:left;line-height:1.2}
.hchip small{display:block;color:var(--faint);font-size:10px}
.hchip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-top:4px}
.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:2px}
.lista{display:flex;flex-direction:column;gap:3px}
.rg{display:grid;grid-template-columns:18px minmax(0,1fr) 70px 54px;gap:8px;align-items:center;font-size:12px;cursor:pointer;padding:4px 5px;border-radius:7px}
.rg:hover,.rg.on{background:var(--primary-soft)}
.rg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg .bar{height:6px;border-radius:5px;background:var(--raised);overflow:hidden}
.rg .bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.rg b{font-family:'Geist Mono',monospace;font-weight:500;text-align:right}

.gridbox{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tools{display:flex;gap:7px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools input[type=search]{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:0 10px;font:12.5px 'Geist',sans-serif;width:260px}
.chip{height:30px;padding:0 11px;border-radius:999px;font:550 12px 'Geist',sans-serif;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
.tools .cnt{margin-left:auto;color:var(--muted);font-size:12px}
#scroll{flex:1;overflow:auto;position:relative;outline:none}
.row,.hdr{display:grid;grid-template-columns:var(--cols);width:max-content;min-width:100%}
.hdr{position:sticky;top:0;z-index:4;background:var(--surface-solid);border-bottom:1px solid var(--line);min-height:44px}
.hdr>div{position:relative;padding:6px 12px 6px 8px;font-size:11.5px;line-height:1.25;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:4px;white-space:normal;background:var(--surface-solid)}
.hdr>div.r{justify-content:flex-end;text-align:right}
.hdr>div:hover{color:var(--primary)}
.hdr>div.edc{background:color-mix(in srgb,var(--primary) 10%,var(--surface-solid));color:var(--primary)}
.hdr .rz{position:absolute;right:0;top:8px;bottom:8px;width:6px;cursor:col-resize;border-right:2px solid transparent}
.hdr .rz:hover,.hdr .rz.on{border-right-color:var(--primary)}
.hdr .ord{font-size:9px;color:var(--primary)}
.fx{position:sticky;z-index:2}
.hdr>div.fx{position:sticky;z-index:5}
.fxl{box-shadow:6px 0 8px -6px rgba(15,23,42,.18)}
#body{position:relative}
.row{position:absolute;left:0;height:34px;font-size:12.5px;cursor:pointer;align-items:stretch}
.row>div{padding:0 8px;white-space:nowrap;display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--surface-solid)}
.row:hover>div{background:color-mix(in srgb,var(--primary) 4%,var(--surface-solid))}
.row.sel>div{background:color-mix(in srgb,var(--primary) 12%,var(--surface-solid))}
.row>div.r{justify-content:flex-end}
.row>div.edc{background:color-mix(in srgb,var(--primary) 7%,var(--surface-solid));padding:0 4px}
.row>div.ed{padding:0 4px}
.row input[type=text]{width:100%;height:26px;border-radius:7px;border:1px solid color-mix(in srgb,var(--primary) 30%,var(--line));background:var(--field);color:var(--ink);text-align:right;padding:0 6px;font:600 12.5px 'Geist Mono',monospace}
.edc input[type=text]{color:var(--primary)}
.row input[type=text]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.row input.man{border-color:var(--amber)!important;background:var(--amber-soft)!important}
.num{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.ok-box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;cursor:pointer;transition:all .15s;color:transparent}
.ok-box.on{background:var(--up);border-color:var(--up);color:#fff}
.ok-box.na{opacity:.25;cursor:default}
.cv{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font:600 11px 'Geist Mono',monospace;color:#fff}
.cvA{background:var(--up)}.cvB{background:var(--primary)}.cvC{background:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--raised);white-space:nowrap}
.side{padding:14px;overflow:auto}
.side .vazio{color:var(--muted);font-size:12.5px;line-height:1.5}
.side h2{margin:0;font-size:14px;font-weight:600;line-height:1.3}
.side .sub{color:var(--muted);font-size:12px;margin:4px 0 10px;display:flex;align-items:center;gap:5px}
.st{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lad{width:100%;height:180px;display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.mc{background:var(--raised);border-radius:10px;padding:8px 10px}
.mc span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.mc b{display:block;font:500 15px 'Geist Mono',monospace;margin-top:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;margin:8px 0}
.facts span{color:var(--muted);display:flex;align-items:center;gap:5px}
.facts b{font-family:'Geist Mono',monospace;font-weight:500;text-align:right;word-break:break-word}
.why{font-size:12px;line-height:1.5;color:var(--muted);background:var(--raised);border-radius:10px;padding:10px;margin:8px 0 10px}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.alts button{justify-content:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--surface-solid);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;transition:all .25s;pointer-events:none;box-shadow:0 18px 40px -20px rgba(0,0,0,.5);z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
.kbd{font:11px 'Geist Mono',monospace;border:1px solid var(--line);border-radius:5px;padding:0 4px;color:var(--faint)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.main{grid-template-columns:1fr}.side{display:none}.viz{grid-template-columns:1fr}}
/* ---- layout v3 ---- */
.linha2{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(320px,1fr);gap:10px}
.histc{padding:12px 14px;min-width:0;position:relative}
.resumo{padding:12px 14px;height:430px;overflow:auto}
#hist svg{width:100%;height:280px;display:block}
.hbox{position:relative}
.htip{position:absolute;z-index:8;pointer-events:none;background:var(--surface-solid);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11.5px;min-width:230px;box-shadow:0 18px 40px -18px rgba(15,23,42,.45);display:none}
.htip b{font-family:'Geist Mono',monospace;font-weight:600}
.htip .l{display:grid;grid-template-columns:1fr auto auto;gap:3px 10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.htip .l em{font-style:normal;color:var(--faint);font-size:10.5px}
.htip .t{font-weight:600;margin-bottom:4px}
.htip .r{display:flex;align-items:center;gap:6px}
.htip .r i{width:10px;height:3px;border-radius:2px;display:inline-block}
.resumo h2{margin:0;font-size:14px;font-weight:600;line-height:1.3}
.resumo .sub{color:var(--muted);font-size:12px;margin:3px 0 8px;display:flex;align-items:center;gap:5px}
.resumo .lad{height:150px}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--down);color:#fff;font:600 10px 'Geist Mono',monospace;display:grid;place-items:center;padding:0 3px}
.ib{position:relative}
.pop.larga{width:760px}
.cm{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cm h5{margin:0 0 2px;font-size:12.5px;font-weight:600}
.cm small{color:var(--muted);font-size:11px;display:block;margin-bottom:6px}
.cm .lst{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.cm .it{display:grid;grid-template-columns:16px 1fr auto auto auto;gap:6px;align-items:center;padding:5px 6px;border-radius:8px;background:var(--raised);margin-bottom:4px;font-size:12px;cursor:grab}
.cm .it.drag{opacity:.4}
.cm .it.sobre{outline:2px dashed var(--primary)}
.cm .it em{font-style:normal;color:var(--faint);font-size:10.5px}
.cm .it button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.cm .it button:disabled{opacity:.3;cursor:default}
.cm .it button svg{width:13px;height:13px}
.cm .grp{font-size:11px;font-weight:600;color:var(--muted);margin:8px 2px 3px}
.cm label{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 4px;border-radius:6px;cursor:pointer}
.cm label:hover{background:var(--raised)}
.cm input[type=search]{width:100%;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:0 8px;font:12.5px 'Geist',sans-serif;margin-bottom:6px}
.cm-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.regp .lista{margin-bottom:10px}
body.foco .kpis,body.foco .linha2{display:none}
@media (max-width:1100px){.linha2{grid-template-columns:1fr}}
/* ---- PriceMetrics: v4 minimalista ---- */
#app{gap:8px;padding:2px 58px 2px 2px}
.topo{display:flex;align-items:center;gap:14px;min-height:44px}
.marca{display:flex;align-items:baseline;gap:10px;flex:none}
.marca h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.marca h1 span{color:var(--primary)}
.marca h1 .logo{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--up));box-shadow:0 6px 16px -8px var(--primary)}
.marca h1 .logo svg{width:14px;height:14px}
.marca small{color:var(--muted);font-size:11.5px;cursor:help}
.kstrip{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;justify-content:safe flex-end}
.kc span{font-size:11px;color:var(--muted)}
.kc{flex:none;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:11px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);white-space:nowrap}
.kc svg{width:14px;height:14px}
.kc b{font:550 14px 'Geist Mono',monospace;letter-spacing:-.02em}
.kc i{font-style:normal;font-size:10.5px;color:var(--faint);font-family:'Geist Mono',monospace}
.linha2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(330px,1fr);gap:8px}
.histc{padding:8px 12px 4px;min-width:0;height:236px}
.hhead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.htit{font-size:12px;font-weight:600;white-space:nowrap}
.htit small{color:var(--faint);font-weight:400;margin-left:4px}
.hchips{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0;margin:0}
.hchip{flex:none;height:24px;padding:0 9px;border-radius:999px;font-size:11px;display:inline-flex;align-items:center;gap:5px}
.hchip .pt{width:5px;height:5px;border-radius:50%;background:var(--up);display:inline-block}
#hist svg{width:100%;height:188px;display:block}
.hvazio{color:var(--muted);font-size:12px;padding:30px 0;line-height:1.6}
.resumo{padding:9px 12px;height:236px;overflow:hidden;display:flex;flex-direction:column}
.rtop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.rnome{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:11px;color:var(--muted);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resumo .lad{width:100%;height:66px;display:block;margin:0;flex:none}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px}
.ms span{display:block;font-size:10px;color:var(--faint)}
.ms b{font:550 12.5px 'Geist Mono',monospace}
.ralts{display:flex;align-items:center;gap:5px;margin-top:auto;padding-top:4px}
.ib2{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.ib2:hover{border-color:var(--primary);color:var(--primary)}
.ib2 svg{width:14px;height:14px}
.rwhy{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;cursor:help;margin-left:2px}
.ralts .tx{margin-left:auto}
button.tx.sm{height:28px;padding:0 10px;font-size:12px}
.gridbox{flex:1;min-height:0}
.dock{position:fixed;right:6px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;padding:8px 6px;border-radius:16px}
.dock .sep{height:1px;width:24px;background:var(--line);margin:2px auto}
.dock .ib{width:36px;height:36px}
.pop{position:fixed!important;right:60px!important;top:80px;left:auto!important}
.kstrip .kc:hover{border-color:var(--line-strong)}
body.fs #app{padding:10px 60px 10px 10px}
body.foco .kpis,body.foco .linha2{display:grid}


.csep{width:1px;height:20px;background:var(--line);margin:0 2px}
.tpi{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:color-mix(in srgb,currentColor 12%,transparent)}
.tpi svg{width:13px;height:13px}
.ib.robo{background:linear-gradient(135deg,#7A3FD1,var(--primary));color:#fff;border-color:transparent;box-shadow:0 8px 18px -10px #7A3FD1}
.ib.robo:hover{color:#fff;filter:brightness(1.08)}
.ib.robo.rodando svg{animation:robo 1s ease-in-out infinite}
@keyframes robo{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) rotate(-6deg)}}
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(15,23,42,.35);backdrop-filter:blur(3px)}
.modal.on{display:grid}
.mcard{width:min(440px,92vw);padding:18px;background:var(--surface-solid)!important}
.mcard h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center}
.mcard p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.5}
.macts{display:flex;justify-content:flex-end;gap:8px}
.oresumo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.oresumo div{background:var(--raised);border-radius:10px;padding:8px 10px}
.oresumo span{display:block;font-size:10.5px;color:var(--muted)}
.oresumo b{font:600 16px 'Geist Mono',monospace}
.olist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.olist table{margin:0}
.olist td,.olist th{font-size:11.5px;white-space:nowrap}
.regras-opt{font-size:11.5px;color:var(--muted);line-height:1.55;background:var(--raised);border-radius:10px;padding:9px 11px;margin-bottom:8px}

#app{display:flex;flex-direction:column;gap:10px;height:100%;padding:2px}
body.fs #app{padding:12px}
.glass{background:var(--surface);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;flex-wrap:wrap;position:relative;z-index:30}
.top h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.top small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}

.acts .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;
  transition:transform .15s,border-color .2s,color .2s,box-shadow .2s,background .2s}
.ib svg{width:17px;height:17px}
.ib:hover{transform:translateY(-1px);border-color:var(--primary);color:var(--primary);box-shadow:0 8px 20px -12px var(--primary)}
.ib.pri{background:linear-gradient(180deg,var(--primary-hover),var(--primary));color:#fff;border-color:transparent}
.ib.gr{background:var(--up-soft);color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,transparent)}
.ib.on{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
button.tx{font:550 12.5px 'Geist',sans-serif;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.tx:hover{border-color:var(--primary);color:var(--primary)}
button.tx.pri{background:linear-gradient(180deg,var(--primary-hover),var(--primary));color:#fff;border-color:transparent}
button.tx.ok{background:var(--up);border-color:var(--up);color:#fff}
#tip{white-space:pre-line!important;max-width:420px;line-height:1.5;text-align:left;position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--canvas);font-size:11.5px;padding:5px 9px;border-radius:7px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap}
#tip.on{opacity:1;transform:none}
.pop{position:absolute;top:44px;right:0;z-index:20;width:420px;padding:14px;display:none;background:var(--surface-solid)!important;box-shadow:0 24px 48px -20px rgba(15,23,42,.45)}
.pop.on{display:block;animation:pin .18s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop h4{margin:0 0 4px;font-size:13px;font-weight:600}
.pop p{margin:0 0 10px;font-size:11.5px;color:var(--muted);line-height:1.45}
.pop table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.pop th{text-align:left;color:var(--faint);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--line)}
.pop td{padding:6px;border-bottom:1px solid var(--line)}
.pop input[type=number],.pop input[type=date],.pop select{width:100%;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:0 8px;font:12.5px 'Geist Mono',monospace}
.opt{display:flex;gap:6px;margin-bottom:10px}
.opt label{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12px}
.opt label.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.opt input{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.grid2 span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.k{padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(16px);position:relative;overflow:hidden}
.k::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--t,var(--faint)),transparent)}
.k span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:500}
.k span svg{color:var(--t)}
.k b{display:block;font:500 19px 'Geist Mono',monospace;letter-spacing:-.03em;margin-top:3px;white-space:nowrap}
.k i{font-style:normal;font-size:11px;color:var(--faint);font-family:'Geist Mono',monospace}
.pos{color:var(--up)}.neg{color:var(--down)!important}


h3{margin:0 0 8px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
h3 small{color:var(--faint);font-weight:400;overflow:hidden;text-overflow:ellipsis}

.hseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.hseg button{border:0;background:transparent;color:var(--muted);font:550 11px 'Geist',sans-serif;padding:3px 10px;cursor:pointer}
.hseg button.on{background:var(--primary);color:#fff}
.hchips{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:2px;scrollbar-width:thin}
.hchip{flex:none;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--ink);text-align:left;line-height:1.2}
.hchip small{display:block;color:var(--faint);font-size:10px}
.hchip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-top:4px}
.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:2px}
.lista{display:flex;flex-direction:column;gap:3px}
.rg{display:grid;grid-template-columns:18px minmax(0,1fr) 70px 54px;gap:8px;align-items:center;font-size:12px;cursor:pointer;padding:4px 5px;border-radius:7px}
.rg:hover,.rg.on{background:var(--primary-soft)}
.rg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg .bar{height:6px;border-radius:5px;background:var(--raised);overflow:hidden}
.rg .bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.rg b{font-family:'Geist Mono',monospace;font-weight:500;text-align:right}

.gridbox{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tools{display:flex;gap:7px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools input[type=search]{height:32px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:0 10px;font:12.5px 'Geist',sans-serif;width:260px}
.chip{height:30px;padding:0 11px;border-radius:999px;font:550 12px 'Geist',sans-serif;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
.tools .cnt{margin-left:auto;color:var(--muted);font-size:12px}
#scroll{flex:1;overflow:auto;position:relative;outline:none}
.row,.hdr{display:grid;grid-template-columns:var(--cols);width:max-content;min-width:100%}
.hdr{position:sticky;top:0;z-index:4;background:var(--surface-solid);border-bottom:1px solid var(--line);min-height:44px}
.hdr>div{position:relative;padding:6px 12px 6px 8px;font-size:11.5px;line-height:1.25;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:4px;white-space:normal;background:var(--surface-solid)}
.hdr>div.r{justify-content:flex-end;text-align:right}
.hdr>div:hover{color:var(--primary)}
.hdr>div.edc{background:color-mix(in srgb,var(--primary) 10%,var(--surface-solid));color:var(--primary)}
.hdr .rz{position:absolute;right:0;top:8px;bottom:8px;width:6px;cursor:col-resize;border-right:2px solid transparent}
.hdr .rz:hover,.hdr .rz.on{border-right-color:var(--primary)}
.hdr .ord{font-size:9px;color:var(--primary)}
.fx{position:sticky;z-index:2}
.hdr>div.fx{position:sticky;z-index:5}
.fxl{box-shadow:6px 0 8px -6px rgba(15,23,42,.18)}
#body{position:relative}
.row{position:absolute;left:0;height:34px;font-size:12.5px;cursor:pointer;align-items:stretch}
.row>div{padding:0 8px;white-space:nowrap;display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--surface-solid)}
.row:hover>div{background:color-mix(in srgb,var(--primary) 4%,var(--surface-solid))}
.row.sel>div{background:color-mix(in srgb,var(--primary) 12%,var(--surface-solid))}
.row>div.r{justify-content:flex-end}
.row>div.edc{background:color-mix(in srgb,var(--primary) 7%,var(--surface-solid));padding:0 4px}
.row>div.ed{padding:0 4px}
.row input[type=text]{width:100%;height:26px;border-radius:7px;border:1px solid color-mix(in srgb,var(--primary) 30%,var(--line));background:var(--field);color:var(--ink);text-align:right;padding:0 6px;font:600 12.5px 'Geist Mono',monospace}
.edc input[type=text]{color:var(--primary)}
.row input[type=text]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.row input.man{border-color:var(--amber)!important;background:var(--amber-soft)!important}
.num{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.ok-box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;cursor:pointer;transition:all .15s;color:transparent}
.ok-box.on{background:var(--up);border-color:var(--up);color:#fff}
.ok-box.na{opacity:.25;cursor:default}
.cv{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font:600 11px 'Geist Mono',monospace;color:#fff}
.cvA{background:var(--up)}.cvB{background:var(--primary)}.cvC{background:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--raised);white-space:nowrap}
.side{padding:14px;overflow:auto}
.side .vazio{color:var(--muted);font-size:12.5px;line-height:1.5}
.side h2{margin:0;font-size:14px;font-weight:600;line-height:1.3}
.side .sub{color:var(--muted);font-size:12px;margin:4px 0 10px;display:flex;align-items:center;gap:5px}
.st{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lad{width:100%;height:180px;display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.mc{background:var(--raised);border-radius:10px;padding:8px 10px}
.mc span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.mc b{display:block;font:500 15px 'Geist Mono',monospace;margin-top:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;margin:8px 0}
.facts span{color:var(--muted);display:flex;align-items:center;gap:5px}
.facts b{font-family:'Geist Mono',monospace;font-weight:500;text-align:right;word-break:break-word}
.why{font-size:12px;line-height:1.5;color:var(--muted);background:var(--raised);border-radius:10px;padding:10px;margin:8px 0 10px}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.alts button{justify-content:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--surface-solid);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;transition:all .25s;pointer-events:none;box-shadow:0 18px 40px -20px rgba(0,0,0,.5);z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
.kbd{font:11px 'Geist Mono',monospace;border:1px solid var(--line);border-radius:5px;padding:0 4px;color:var(--faint)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.main{grid-template-columns:1fr}.side{display:none}.viz{grid-template-columns:1fr}}
/* ---- layout v3 ---- */

.histc{padding:12px 14px;min-width:0;position:relative}
.resumo{padding:12px 14px;height:430px;overflow:auto}
#hist svg{width:100%;height:280px;display:block}

.htip .l em{font-style:normal;color:var(--faint);font-size:10.5px}
.htip .t{font-weight:600;margin-bottom:4px}
.htip .r{display:flex;align-items:center;gap:6px}
.htip .r i{width:10px;height:3px;border-radius:2px;display:inline-block}

.resumo .lad{height:150px}

.ib{position:relative}
.pop.larga{width:760px}
.cm{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cm h5{margin:0 0 2px;font-size:12.5px;font-weight:600}
.cm small{color:var(--muted);font-size:11px;display:block;margin-bottom:6px}
.cm .lst{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.cm .it{display:grid;grid-template-columns:16px 1fr auto auto auto;gap:6px;align-items:center;padding:5px 6px;border-radius:8px;background:var(--raised);margin-bottom:4px;font-size:12px;cursor:grab}
.cm .it.drag{opacity:.4}
.cm .it.sobre{outline:2px dashed var(--primary)}
.cm .it em{font-style:normal;color:var(--faint);font-size:10.5px}
.cm .it button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.cm .it button:disabled{opacity:.3;cursor:default}
.cm .it button svg{width:13px;height:13px}
.cm .grp{font-size:11px;font-weight:600;color:var(--muted);margin:8px 2px 3px}
.cm label{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 4px;border-radius:6px;cursor:pointer}
.cm label:hover{background:var(--raised)}
.cm input[type=search]{width:100%;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:0 8px;font:12.5px 'Geist',sans-serif;margin-bottom:6px}
.cm-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.regp .lista{margin-bottom:10px}
body.foco .kpis,body.foco .linha2{display:none}
@media (max-width:1100px){.linha2{grid-template-columns:1fr}}

.resumo{padding:9px 12px;height:236px;overflow:hidden;display:flex;flex-direction:column}

body.fs #app{padding:10px 60px 10px 10px}
body.foco .kpis,body.foco .linha2{display:grid}


.csep{width:1px;height:20px;background:var(--line);margin:0 2px}
.tpi{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:color-mix(in srgb,currentColor 12%,transparent)}
.tpi svg{width:13px;height:13px}
.ib.robo{background:linear-gradient(135deg,#7A3FD1,var(--primary));color:#fff;border-color:transparent;box-shadow:0 8px 18px -10px #7A3FD1}

.modal.on{display:grid}
.mcard{width:min(440px,92vw);padding:18px;background:var(--surface-solid)!important}
.mcard h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center}
.mcard p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.5}

.oresumo div{background:var(--raised);border-radius:10px;padding:8px 10px}
.oresumo span{display:block;font-size:10.5px;color:var(--muted)}

.olist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}

  const DIA_H = (() => { const hoje = new Date(), ano = hoje.getFullYear(), mes = hoje.getMonth() + 1;

    for (const j of rows) if (D.dk[j] === k && TIPO_OK.has(D.dtp[j]) && Math.abs(D.dv[j] / 100 - preco) < 0.005) ancora = Math.max(ancora, DIA_H[D.dt[j]]);

  /* ---------- linha do tempo das campanhas ---------- */
  function gantt(){
    const cp = D.campanhas.map((nome, c) => ({ nome, c, ini: Infinity, fim: -Infinity, n: 0, crit: 0, inv: 0 }));
    for (let i = 0; i < N; i++) { const o = cp[D.ci[i]]; if (isFinite(INI[i])) o.ini = Math.min(o.ini, INI[i]); if (isFinite(FIM[i])) o.fim = Math.max(o.fim, FIM[i]); o.n++; if (S[i] === 1 || S[i] === 2) o.crit++; o.inv += invest(i); }

        <b>${brc(ds(o.ini))}–${brc(ds(o.fim))}</b> ${nf0.format(o.n)}${o.crit ? ` <i>${nf0.format(o.crit)} críticas</i>` : ''}</div></div></div>`; }
    $('gantt').innerHTML = h;

  on($('gantt'), 'click', e => { const r = e.target.closest('[data-c]'); if (!r) return; const c = +r.dataset.c; F.camp = F.camp === c ? -1 : c; gantt(); filtrar(); sc.scrollTop = 0; render(); toast(F.camp >= 0 ? 'Filtro: ' + D.campanhas[c] : 'Todas as campanhas'); });

  /* ---------- edição ---------- */

  /* ---------- correções inteligentes ---------- */
  function precoMaioria(i){ const c = new Map(); for (let j = 0; j < N; j++) if (D.ci[j] === D.ci[i] && D.prod[j] === D.prod[i] && INI[j] === INI[i] && FIM[j] === FIM[i]) c.set(PR[j], (c.get(PR[j]) || 0) + 1);
    let best = null, n = 0; for (const [p, q] of c) if (q > n || (q === n && p < best)) { best = p; n = q; } return best; }
  function corrigirPreco(lista){ let n = 0; for (const i of lista) if (S[i] === ST_PRECO) { const p = precoMaioria(i); if (p != null && p !== PR[i]) { PR[i] = p; marcarEd(i); n++; } } return n; }
  function corrigirDatas(lista){ let n = 0; const alvo = new Set(lista);
    const por = new Map(); for (let i = 0; i < N; i++) { const k = D.fil[i] + '|' + D.prod[i]; let l = por.get(k); if (!l) por.set(k, l = []); l.push(i); }
    for (const l of por.values()) { if (l.length < 2 || !l.some(i => alvo.has(i))) continue; l.sort((a, b) => INI[a] - INI[b] || FIM[a] - FIM[b]);

    return n; }
  $('bPreco').onclick = () => { const n = corrigirPreco(VIS); atualizar(); toast(n ? `${nf0.format(n)} preços unificados pelo preço da maioria` : 'Nenhum erro de preço no filtro'); };
  $('bDatas').onclick = () => { const n = corrigirDatas(VIS); atualizar(); toast(n ? `${nf0.format(n)} períodos encerrados na véspera da oferta seguinte` : 'Nenhum conflito resolvível no filtro'); };

  on(cm, 'click', e => { const b = e.target.closest('[data-ctx]'); if (!b || b.disabled) return; const i = +cm.dataset.i, a = b.dataset.ctx; fecha();

    atualizar(); });
  on(document, 'click', e => { if (!e.target.closest('.ctx')) fecha(); });
  on(document, 'keydown', e => { if (e.key === 'Escape') { fecha(); $('pExp').classList.remove('on'); } });
  on(sc, 'scroll', fecha);

  /* ---------- importação: padrão (mídia calculada) e antigo (tipo de oferta) ---------- */
  function montaExp(){
    const crit = VIS.filter(i => !EXC[i] && (S[i] === 1 || S[i] === 2)).length, tipos = (A.tipos || []).map(t => `<option>${esc(t)}</option>`).join('');
    $('pExp').innerHTML = `<h4>${ic('up', 'var(--primary)')} Importação do encarte</h4><p>Usa as linhas do filtro atual que não foram tiradas da importação. Varejo (tipo 1) e atacado (tipo 2) com o mesmo preço.</p>

        <label><input type="radio" name="fmt" value="a"><b>Antigo</b><small>tipo de oferta informado, motivo 7</small></label></div>

    preview(); }
  const opt = n => $('pExp').querySelector(`input[name=${n}]:checked`).value;
  function linhasImp(){ const fmt = opt('fmt'), op = opt('op'), crit = $('xCrit').checked, tipoIn = $('xTipo').value.trim(), l = [], vistos = new Set();
    const f2 = v => nf2.format(v).replace(/\./g, '');
    for (const i of VIS) { if (EXC[i] || (!crit && (S[i] === 1 || S[i] === 2))) continue;
      const k = [D.fil[i], D.prod[i], PR[i], INI[i], FIM[i]].join('|'); if (vistos.has(k)) continue; vistos.add(k);
      const t3 = fmt === 'p' ? String(midia(i)) : (D.oferta[i] || tipoIn || '');

      <small>${nf0.format(l.length)} linhas de importação${semTipo ? ', <b class="neg">informe o tipo de oferta</b>' : ''}</small>`; }
  on($('pExp'), 'change', e => { $('pExp').querySelectorAll('.opt label').forEach(x => x.classList.toggle('on', x.querySelector('input').checked)); preview(); });
  on($('pExp'), 'input', e => { if (e.target.id === 'xTipo') preview(); });
  on($('pExp'), 'click', async e => { const b = e.target.closest('button'); if (!b) return; const l = linhasImp(); if (!l.length) { toast('Nada para importar no filtro'); return; }

  on(document, 'click', e => { if (!e.target.closest('#pExp') && !e.target.closest('#bExp') && !e.target.closest('.modal')) $('pExp').classList.remove('on'); });

  on($('q'), 'input', e => { F.q = e.target.value; clearTimeout(e.target._t); e.target._t = setTimeout(() => { filtrar(); sc.scrollTop = 0; render(); }, 150); });

  /* ===================== calendário e histórico de campanhas programadas ===================== */
  const enviar = v => window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:setComponentValue', value: v, dataType: 'json' }, '*');
  const HIST = new Map((A.historico || []).map(h => [h.campanha, h]));
  const atuais = new Map(); for (let i = 0; i < N; i++) { const c = D.campanhas[D.ci[i]]; let o = atuais.get(c); if (!o) atuais.set(c, o = { ini: Infinity, fim: -Infinity, itens: 0, fil: new Set() });
    if (isFinite(INI[i])) o.ini = Math.min(o.ini, INI[i]); if (isFinite(FIM[i])) o.fim = Math.max(o.fim, FIM[i]); o.itens++; o.fil.add(D.fil[i]); }
  const camps = () => { const l = new Map();
    for (const [c, h] of HIST) l.set(c, { nome: c, ini: dn(h.inicio), fim: dn(h.fim), itens: h.itens, fil: h.filiais, status: h.status || 'pendente', por: h.atualizado_por || '', em: h.atualizado_em || '', carregada: atuais.has(c) });

    return [...l.values()].sort((a, b) => b.ini - a.ini); };
  const SCOR = { programada: 'var(--up)', pendente: 'var(--amber)', nova: 'var(--primary)' }, SNOM = { programada: 'Programada', pendente: 'Pendente', nova: 'Nova (não salva)' };
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  let mesRef = new Date(hj.getFullYear(), hj.getMonth(), 1), selC = new Set();
  function calendario(){
    const l = camps(), y = mesRef.getFullYear(), m = mesRef.getMonth(), d0 = Date.UTC(y, m, 1) / 864e5, nd = new Date(y, m + 1, 0).getDate(), pad = (new Date(y, m, 1).getDay() + 6) % 7;

        <div class="clist"><table><tr><th><input type="checkbox" id="cTodas"></th><th>Campanha</th><th>Período</th><th class="r">Itens</th><th>Status</th></tr>
          ${l.map(c => `<tr><td><input type="checkbox" data-c="${esc(c.nome)}" ${selC.has(c.nome) ? 'checked' : ''}></td><td class="cn" title="${esc(c.nome)}">${esc(c.nome)}${c.carregada ? '' : ' <small>histórico</small>'}</td>
            <td>${brc(ds(c.ini))} a ${brc(ds(c.fim))}</td><td class="r">${nf0.format(c.itens || 0)}</td><td><span class="tag" style="color:${SCOR[c.status]}" data-tip="${c.por ? 'Atualizado por ' + esc(c.por) + (c.em ? ' em ' + esc(String(c.em).slice(0, 16).replace('T', ' ')) : '') : ''}">${SNOM[c.status]}</span></td></tr>`).join('')}</table></div></div>
      <div class="cm-acts"><button class="tx" id="cPend">${ic('undo')}Voltar para pendente</button><button class="tx" id="cProg">${ic('check')}Marcar selecionadas como programadas</button>
        <button class="tx pri" id="cTudo">${ic('check')}Marcar todas como importadas</button></div>`;
  }
  function mudarStatus(nomes, status){ if (!nomes.length) { toast('Selecione ao menos uma campanha'); return; }
    const agora = new Date().toISOString();
    for (const n of nomes) { const h = HIST.get(n) || { campanha: n }; const o = atuais.get(n); if (o) Object.assign(h, { inicio: ds(o.ini), fim: ds(o.fim), itens: o.itens, filiais: o.fil.size });
      HIST.set(n, Object.assign(h, { status, atualizado_em: agora, atualizado_por: A.usuario || '' })); }
    const itens = []; for (let i = 0; i < N; i++) { const c = D.campanhas[D.ci[i]]; if (nomes.includes(c) && !EXC[i]) itens.push([c, D.fil[i], D.prod[i], PR[i], ds(INI[i]), ds(FIM[i])]); }
    enviar({ acao: 'campanhas', status, campanhas: nomes.map(n => HIST.get(n)), itens, ts: Date.now() });
    selC.clear(); calendario(); toast(`${nomes.length} campanha(s) ${status === 'programada' ? 'programada(s)' : 'de volta para pendente'}`); }
  on($('pCal'), 'click', e => { const b = e.target.closest('button'); if (!b) return;

    if (t.dataset.c) t.checked ? selC.add(t.dataset.c) : selC.delete(t.dataset.c); });
  $('bCal').onclick = e => { calendario(); const p = $('pCal'); p.classList.toggle('on'); p.style.top = '60px'; };
  on(document, 'click', e => { if (!e.target.closest('#pCal') && !e.target.closest('#bCal')) $('pCal').classList.remove('on'); });
  const vencidas = new Set(); for (let i = 0; i < N; i++) if (FIM[i] < HOJE) vencidas.add(D.campanhas[D.ci[i]]);

  validar(); kpis(); gantt(); filtrar(); render(); if (VIS.length) selecionar(VIS[0]); else painel(-1);
}


return montar;
