<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@import url('__FONTE__');
:root{__TOKENS__}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--ink);font:13px 'Geist',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body.fs{background:var(--canvas)}
svg.i{width:15px;height:15px;flex:none;vertical-align:-2px}
#app{display:flex;flex-direction:column;gap:10px;height:100%;padding:2px}
body.fs #app{padding:12px}
.glass{background:var(--surface);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;flex-wrap:wrap;position:relative;z-index:30}
.top h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.top small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}
.acts{display:flex;gap:6px;align-items:center;position:relative}
.acts .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;
  transition:transform .15s,border-color .2s,color .2s,box-shadow .2s,background .2s}
.ib svg{width:17px;height:17px}
.ib:hover{transform:translateY(-1px);border-color:var(--primary);color:var(--primary);box-shadow:0 8px 20px -12px var(--primary)}
.ib.pri{background:linear-gradient(180deg,var(--primary-hover),var(--primary));color:#fff;border-color:transparent}
.ib.gr{background:var(--up-soft);color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,transparent)}
.ib.on{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
button.tx{font:550 12.5px 'Geist',sans-serif;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.tx:hover{border-color:var(--primary);color:var(--primary)}
button.tx.pri{background:linear-gradient(180deg,var(--primary-hover),var(--primary));color:#fff;border-color:transparent}
button.tx.ok{background:var(--up);border-color:var(--up);color:#fff}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--canvas);font-size:11.5px;padding:5px 9px;border-radius:7px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap}
#tip.on{opacity:1;transform:none}
.pop{position:absolute;top:44px;right:0;z-index:20;width:420px;padding:14px;display:none;background:var(--surface-solid)!important;box-shadow:0 24px 48px -20px rgba(15,23,42,.45)}
.pop.on{display:block;animation:pin .18s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop h4{margin:0 0 4px;font-size:13px;font-weight:600}
.pop p{margin:0 0 10px;font-size:11.5px;color:var(--muted);line-height:1.45}
.pop table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
.pop th{text-align:left;color:var(--faint);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--line)}
.pop td{padding:6px;border-bottom:1px solid var(--line)}
.pop input[type=number],.pop input[type=date],.pop select{width:100%;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:0 8px;font:12.5px 'Geist Mono',monospace}
.opt{display:flex;gap:6px;margin-bottom:10px}
.opt label{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12px}
.opt label.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.opt input{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.grid2 span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.k{padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(16px);position:relative;overflow:hidden}

.pos{color:var(--up)}.neg{color:var(--down)!important}
.viz{display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:10px}
.viz .glass{padding:12px 14px;min-width:0}

h3 small{color:var(--faint);font-weight:400;overflow:hidden;text-overflow:ellipsis}
#hist svg{width:100%;height:150px;display:block}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-top:4px}
.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:2px}
.lista{display:flex;flex-direction:column;gap:3px}
.rg{display:grid;grid-template-columns:18px minmax(0,1fr) 70px 54px;gap:8px;align-items:center;font-size:12px;cursor:pointer;padding:4px 5px;border-radius:7px}
.rg:hover,.rg.on{background:var(--primary-soft)}
.rg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg .bar{height:6px;border-radius:5px;background:var(--raised);overflow:hidden}
.rg .bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.rg b{font-family:'Geist Mono',monospace;font-weight:500;text-align:right}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px}
.gridbox{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tools{display:flex;gap:7px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}

.chip:hover{border-color:var(--primary);color:var(--primary)}

.tools .cnt{margin-left:auto;color:var(--muted);font-size:12px}

.row,.hdr{display:grid;grid-template-columns:var(--cols);width:max-content;min-width:100%}
.hdr{position:sticky;top:0;z-index:4;background:var(--surface-solid);border-bottom:1px solid var(--line);min-height:44px}
.hdr>div{position:relative;padding:6px 12px 6px 8px;font-size:11.5px;line-height:1.25;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;

.fx{position:sticky;z-index:2}
.hdr>div.fx{position:sticky;z-index:5}
.fxl{box-shadow:6px 0 8px -6px rgba(15,23,42,.18)}
#body{position:relative}

.st{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lad{width:100%;height:180px;display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.mc{background:var(--raised);border-radius:10px;padding:8px 10px}
.mc span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.mc b{display:block;font:500 15px 'Geist Mono',monospace;margin-top:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;margin:8px 0}
.facts span{color:var(--muted);display:flex;align-items:center;gap:5px}
.facts b{font-family:'Geist Mono',monospace;font-weight:500;text-align:right;word-break:break-word}
.why{font-size:12px;line-height:1.5;color:var(--muted);background:var(--raised);border-radius:10px;padding:10px;margin:8px 0 10px}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.alts button{justify-content:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--surface-solid);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12.5px;transition:all .25s;pointer-events:none;box-shadow:0 18px 40px -20px rgba(0,0,0,.5);z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}
.kbd{font:11px 'Geist Mono',monospace;border:1px solid var(--line);border-radius:5px;padding:0 4px;color:var(--faint)}
body.foco .kpis,body.foco .viz{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.main{grid-template-columns:1fr}.side{display:none}.viz{grid-template-columns:1fr}}

const semPesq = i => D.orig[i] === 1 || !(D.vmk[i] > 0);

function calc(i){
  const c = D.cu[i], vmk = D.vmk[i], amk = D.amk[i] || 0, merch = D.merch[i] || 0;
  const mobj = D.pobj[i] ?? MOBJ, mmax = (D.pmax[i] > 0 ? D.pmax[i] : MMAX), ps = PISO[D.ui[i]] || { cesta: -15, sem: 0 };

}
$('regras').addEventListener('click', e => { const r = e.target.closest('[data-rgf]'); if (!r) return; const k = +r.dataset.rgf; F.regra = F.regra === k ? -1 : k; atualizar(); });
$('cortes').addEventListener('click', e => { const r = e.target.closest('[data-ct]'); if (!r) return; const k = +r.dataset.ct; F.corte = F.corte === k ? -1 : k; atualizar(); });

/* ---------- histórico de preço (concorrentes da filial, dia a dia) ---------- */
const HIX = new Map(); for (let j = 0; j < D.hi.length; j++) { const i = D.hi[j]; if (!HIX.has(i)) HIX.set(i, []); HIX.get(i).push(j); }
const CORES = ['#2D4BFF', '#E11D48', '#0E9F6E', '#C47A0A', '#7A3FD1', '#0B8DB0'];
function historico(i){
  const box = $('hist');
  if (i < 0) { $('histSub').textContent = ''; box.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:30px 0">Selecione um item.</div>'; return; }
  $('histSub').textContent = curto(D.produtos[D.pi[i]]).slice(0, 38) + ', ' + curto(D.filiais[D.fi[i]]);
  const js = HIX.get(i) || [];
  if (!js.length) { box.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:30px 0">Sem coletas de concorrentes para este item no período.</div>'; return; }
  const por = new Map(); for (const j of js) { const k = D.hk[j]; if (!por.has(k)) por.set(k, []); por.get(k).push([D.hd[j], D.hv[j] / 100]); }
  const series = [...por.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 6);
  const T = D.hT.length, vals = series.flatMap(s => s[1].map(p => p[1])).concat([D.vm[i], NV[i]]).filter(v => v > 0);
  const lo = Math.min(...vals) * 0.97, hi = Math.max(...vals) * 1.03, Wd = 600, Ht = 150, pl = 6, pr = 44, pt = 8, pb = 18;
  const X = d => pl + (Wd - pl - pr) * d / Math.max(1, T - 1), Y = v => pt + (Ht - pt - pb) * (1 - (v - lo) / (hi - lo || 1));
  let s = `<svg viewBox="0 0 ${Wd} ${Ht}" preserveAspectRatio="none">`;
  for (let g = 0; g <= 3; g++) { const v = lo + (hi - lo) * g / 3, y = Y(v); s += `<line x1="${pl}" x2="${Wd - pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${Wd - pr + 4}" y="${y + 3}" font-size="9.5" fill="var(--faint)" font-family="Geist Mono">${nf2.format(v)}</text>`; }
  [0, Math.floor((T - 1) / 2), T - 1].forEach(d => { s += `<text x="${X(d)}" y="${Ht - 4}" font-size="9.5" fill="var(--faint)" text-anchor="${d === 0 ? 'start' : d === T - 1 ? 'end' : 'middle'}" font-family="Geist Mono">${D.hT[d]}</text>`; });
  s += `<line x1="${pl}" x2="${Wd - pr}" y1="${Y(D.vm[i])}" y2="${Y(D.vm[i])}" stroke="var(--ink)" stroke-dasharray="4 4" stroke-opacity=".5"/>`;
  s += `<line x1="${pl}" x2="${Wd - pr}" y1="${Y(NV[i])}" y2="${Y(NV[i])}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="2 3"/>`;
  series.forEach(([k, pts], n) => { pts.sort((a, b) => a[0] - b[0]); const c = CORES[n % CORES.length];
    s += `<polyline fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round" points="${pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>`;
    pts.forEach(p => { s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.6" fill="${c}"><title>${esc(curto(D.hK[k]))}: R$ ${nf2.format(p[1])} em ${D.hT[p[0]]}</title></circle>`; }); });
  s += '</svg>';
  box.innerHTML = s + '<div class="leg">' + series.map(([k], n) => `<span title="${esc(D.hK[k])}"><i style="background:${CORES[n % CORES.length]}"></i>${esc(curto(D.hK[k]).split(' - ')[0])}</span>`).join('')
    + `<span><i style="background:var(--ink);opacity:.5"></i>Varejo atual</span><span><i style="background:var(--primary)"></i>Novo varejo</span></div>`;
}

/* ---------- painel do item ---------- */
const EXPL = [
  i => 'Segue o menor preço do mercado, R$ 0,01 abaixo, dentro da trava mínima e da trava máxima de margem.', null,
  i => `O mercado está acima do preço máximo (margem máxima de ${nf1.format(UMAX[i])}%): o varejo fica no teto e o atacado sai do teto com a base de redução de ${nf1.format(D.merch[i] || 0)}%.`,
  i => D.cesta[i] ? `Item da cesta: seguir o mercado deixaria a margem abaixo de ${nf1.format(UMIN[i])}%, então o preço fica na trava mínima da cesta.` : `Seguir o mercado deixaria a margem abaixo da mínima (${nf1.format(UMIN[i])}%): o preço fica na trava mínima.`,
  i => `Sem pesquisa direta: o varejo vai para a margem objetiva de ${nf1.format(UOBJ[i])}% e o atacado sai do objetivo com a base de redução de ${nf1.format(D.merch[i] || 0)}%.`,
  i => 'Preço definido manualmente na mesa.',
];
function lateral(i){
  if (i < 0) { $('side').innerHTML = `<div class="vazio">${ic('tagi', 'var(--primary)')} Clique em um item para ver a régua de preço, as modas, o concorrente e o motivo do novo preço. Use <span class="kbd">↑</span> <span class="kbd">↓</span> para navegar e <span class="kbd">espaço</span> para aceitar.</div>`; return; }
  const c = D.cu[i], pts = [['Custo', c, 'var(--faint)'], ['Mínimo', MN[i], 'var(--up)'], ['Objetivo', OB[i], 'var(--amber)'], ['Mercado', D.vmk[i] || null, 'var(--primary)'],
    ['Moda', D.mo[i] || null, '#B794FF'], ['Máximo', MX[i], 'var(--down)'], ['Atual', D.vm[i], 'var(--ink)'], ['Novo', NV[i], 'var(--primary)']].filter(p => p[1] > 0).sort((a, b) => a[1] - b[1]);
  const vs = pts.map(p => p[1]), lo = Math.min(...vs) * 0.97, hi = Math.max(...vs) * 1.03, X = v => 14 + (v - lo) / (hi - lo) * 272;
  let svg = `<svg class="lad" viewBox="0 0 300 180"><line x1="14" y1="90" x2="286" y2="90" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>`
    + `<line x1="${X(MN[i])}" y1="90" x2="${X(MX[i])}" y2="90" stroke="var(--up)" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"/>`;
  pts.forEach(([t, v, cor], k) => { const lv = k % 4, up = lv % 2 === 0, longe = lv < 2, x = Math.min(270, Math.max(30, X(v))), xr = X(v), novo = t === 'Novo';
    const yt = up ? (longe ? 12 : 42) : (longe ? 156 : 126), yl = up ? (longe ? 28 : 58) : (longe ? 144 : 114);
    svg += `<line x1="${xr}" y1="90" x2="${x}" y2="${yl}" stroke="${cor}" stroke-width="${novo ? 2 : 1}" stroke-opacity=".7"/><circle cx="${xr}" cy="90" r="${novo ? 6 : 4}" fill="${cor}" stroke="var(--surface-solid)" stroke-width="2"/>
      <text x="${x}" y="${yt}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="Geist">${t}</text><text x="${x}" y="${yt + 12}" text-anchor="middle" font-size="10.5" fill="${cor}" font-family="Geist Mono" font-weight="${novo ? 600 : 500}">${nf2.format(v)}</text>`; });
  svg += '</svg>';
  const dm = D.mo[i] && D.vmk[i] > 0 && !D.orig[i] ? D.vmk[i] / D.mo[i] - 1 : null, m1 = (NV[i] - c) / NV[i], tp = D.tipos[D.ti[i]] || '–';
  const mc = (t, v, n, k) => `<div class="mc"><span>${ic(n)}${t}</span><b class="${k || ''}">${v}</b></div>`;
  $('side').innerHTML = `<h2>${esc(D.produtos[D.pi[i]])}</h2><div class="sub">${ic('loja')}${esc(D.filiais[D.fi[i]])}, curva ${'ABC'[D.curva[i]]}${D.cesta[i] ? ', cesta' : ''}</div>
    <div class="st">${tagRegra(i)}${tagCorte(i)}</div>${svg}
    <div class="cards">${mc('Moda varejo', brl(D.mo[i]), 'moda')}${mc('Moda atacado', brl(D.ma[i]), 'moda')}
      ${mc('Menor varejo', brl(D.vmk[i]), 'merc')}${mc('Menor atacado', brl(D.amk[i]), 'merc')}
      ${mc('Menor ÷ moda', dm == null ? '–' : (dm > 0 ? '+' : '') + pct(dm), 'pct', dm < 0 ? 'neg' : '')}${mc('Margem nova', pct(m1), 'pct', m1 < 0 ? 'neg' : 'pos')}</div>
    <div class="facts"><span>${ic('conc')}Concorrente</span><b>${esc(D.orig[i] ? 'moda (sem pesquisa direta)' : curto(D.concs[D.ki[i]]) || '–')}</b>
      <span>${ic('regra')}Regra de negócio</span><b>${esc(rotRegra(i))}</b>
      <span>${ic('cal')}Data pesquisa</span><b>${D.orig[i] ? 'moda' : esc(D.datas[D.dti[i]] || '–')}</b>
      <span>${ic('tagi')}Tipo de preço PDV</span><b>${esc(tp)}</b>
      <span>${ic('cal')}Data fim do preço</span><b>${D.dfim[i] > 0 ? dfTxt(D.dfim[i]) : 'não informada na 1082'}</b>
      <span>${ic('obj')}Margens obj. / mín. / máx.</span><b>${nf1.format(UOBJ[i])}% / ${nf1.format(UMIN[i])}% / ${nf1.format(UMAX[i])}%</b>
      <span>${ic('pct')}Base redução atacado</span><b>${nf1.format(D.merch[i] || 0)}%</b>
      <span>${ic('cash')}Venda mês</span><b>R$ ${nf0.format(D.venda[i])}</b></div>
    <div class="why"><b style="color:${REGRAS[RG[i]][2]}">${rotRegra(i)}.</b> ${EXPL[RG[i]](i)}</div>
    <div class="alts"><button class="tx" data-alt="m">${ic('merc')}Mercado − 0,01</button><button class="tx" data-alt="o">${ic('moda')}Moda − 0,01</button>
      <button class="tx" data-alt="b">${ic('obj')}Objetivo</button><button class="tx" data-alt="r">${ic('undo')}Sugestão</button>
      <button class="tx ${aceito(i) ? 'ok' : ''}" data-alt="ok" style="grid-column:1/-1" ${MUD[i] ? '' : 'disabled'}>${ic('check')}${aceito(i) ? 'Aceito' : 'Aceitar este preço'}</button></div>`;
}
$('side').addEventListener('click', e => { const b = e.target.closest('[data-alt]'); if (!b || SEL < 0) return; const i = SEL, k = b.dataset.alt;
  if (k === 'ok') { alternarAceite(i); return; }
  if (k === 'r') { OV.delete(i); OVA.delete(i); }
  else { const v = k === 'm' ? (D.vmk[i] > 0 ? D.vmk[i] - CENT : null) : k === 'o' ? (D.mo[i] ? D.mo[i] - CENT : null) : OB[i]; if (!v) { toast('Sem esse preço para o item'); return; }
    OV.set(i, Math.max(roundVarejo(v), 0.01)); OVA.delete(i); }
  calc(i); salvar(); atualizar(false); lateral(i); historico(i); });

/* ---------- painéis: arredondamento, piso e importação ---------- */
const pops = ['pRnd', 'pPiso', 'pExp'];
function abrir(id){ pops.forEach(p => $(p).classList.toggle('on', p === id && !$(p).classList.contains('on'))); }
document.addEventListener('click', e => { if (!e.target.closest('.pop') && !e.target.closest('#bRnd,#bPiso,#bExp')) pops.forEach(p => $(p).classList.remove('on')); });
const faixas = [['A', 'Até R$ 10,99'], ['B', 'R$ 11,00 a R$ 19,99'], ['C', 'R$ 20,00 a R$ 40,00'], ['D', 'Acima de R$ 40,00']];
const fim = (reg, f) => f === 'A' ? `centavos terminando em ${reg[f].join(', ')}` : f === 'B' ? `dezena 1 a 9, final ${reg[f].join(', ')}` :
  `dezena 3 a 9, final ${reg[f].filter(x => x).join(', ')}${reg[f].includes(0) ? ' (ou ,50 e ,90)' : ''}`;
function montaRnd(){
  $('pRnd').innerHTML = `<h4>Regra de arredondamento</h4><p>O novo varejo é ajustado para o centavo permitido mais próximo. O atacado sempre termina no mesmo dígito do varejo e nunca passa dele.</p>
    <div class="opt">${Object.entries(REGRA_RND).map(([k, r]) => `<label class="${RND === k ? 'on' : ''}"><input type="radio" name="rnd" value="${k}" ${RND === k ? 'checked' : ''}><b>${r.nome}</b></label>`).join('')}</div>
    <table><tr><th>Faixa</th><th>Preço</th><th>Centavos permitidos</th></tr>${faixas.map(([f, t]) => `<tr><td>${f}</td><td>${t}</td><td>${fim(REGRA_RND[RND], f)}</td></tr>`).join('')}</table>`;
}
$('pRnd').addEventListener('change', e => { if (e.target.name !== 'rnd') return; RND = e.target.value; VC = tabelaVC(REGRA_RND[RND]); montaRnd(); calcTudo(); salvar(); atualizar(); if (SEL >= 0) { lateral(SEL); historico(SEL); } toast('Regra: ' + REGRA_RND[RND].nome); });
function montaPiso(){
  $('pPiso').innerHTML = `<h4>Piso de margem por estado</h4><p>Itens da cesta usam a margem mínima do estado (padrão −15%). Os demais usam a margem mínima do Profimetrics; sem regra, o piso do estado (padrão 0%, o custo).</p>
    <table><tr><th>Estado</th><th>Cesta (%)</th><th>Sem Profimetrics (%)</th></tr>${D.ufs.map((u, k) => `<tr><td>${esc(u)}</td><td><input type="number" step="0.5" data-uf="${k}" data-c="cesta" value="${PISO[k].cesta}"></td><td><input type="number" step="0.5" data-uf="${k}" data-c="sem" value="${PISO[k].sem}"></td></tr>`).join('')}</table>
    <button class="tx" id="pisoPad">${ic('undo')}Voltar ao padrão</button>`;
}
$('pPiso').addEventListener('change', e => { const t = e.target; if (!t.dataset.uf) return; const v = parseFloat(String(t.value).replace(',', '.')); if (!isFinite(v)) return;
  PISO[+t.dataset.uf][t.dataset.c] = v; calcTudo(); salvar(); atualizar(); if (SEL >= 0) lateral(SEL); });
$('pPiso').addEventListener('click', e => { if (!e.target.closest('#pisoPad')) return; D.ufs.forEach((_, u) => PISO[u] = { cesta: -15, sem: 0 }); montaPiso(); calcTudo(); salvar(); atualizar(); });
const iso = d => d.toISOString().slice(0, 10), br = s => s.split('-').reverse().join('/');
function montaExp(){
  const h = new Date(), f = new Date(); f.setDate(f.getDate() + 3);
  $('pExp').innerHTML = `<h4>Importação de preços</h4><p>Layout PRICE do Preço Bot, tipo de oferta 21. Vão só os preços aceitos: varejo (tipo 1) e atacado (tipo 2).</p>
    <div class="opt"><label class="on"><input type="radio" name="op" value="1" checked><b>Aplicar preço</b></label><label><input type="radio" name="op" value="2"><b>Cancelar preço</b></label></div>
    <div class="grid2"><div><span>Data início</span><input type="date" id="eIni" value="${iso(h)}"></div><div><span>Data fim</span><input type="date" id="eFim" value="${iso(f)}"></div>
      <div><span>Aplicar similar</span><select id="eSim"><option>NAO</option><option>SIM</option></select></div><div><span>Tipo de oferta</span><input type="number" id="eTipo" value="21"></div></div>
    <div style="display:flex;gap:8px"><button class="tx pri" id="eXls">${ic('up')}Baixar Excel</button><button class="tx" id="eCopy">${ic('copy')}Copiar</button></div>`;
}
$('pExp').addEventListener('change', e => { if (e.target.name === 'op') $('pExp').querySelectorAll('.opt label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked)); });
function linhasImportacao(){
  const op = $('pExp').querySelector('input[name=op]:checked').value, ini = br($('eIni').value), fimd = br($('eFim').value), sim = $('eSim').value, tipo = String($('eTipo').value || '21');
  const f2 = v => v > 0 ? nf2.format(v).replace(/\./g, '') : '', l = [];
  for (let i = 0; i < N; i++) { if (!aceito(i)) continue; const fil = D.filial_cod[D.fi[i]], prod = D.produto_cod[D.pi[i]];
    l.push([fil, '1', tipo, prod, f2(NV[i]), ini, fimd, sim, op]);
    if (NA[i] > 0 || op === '2') l.push([fil, '2', tipo, prod, f2(NA[i]), ini, fimd, sim, op]); }
  return l;
}
const CAB = ['Código da Filial', 'Tipo de Preço', 'ID Classificação', 'Código do Produto', 'Preço', 'Data Início', 'Data Fim', 'Similar', 'Tipo Operação'];
const hojeTxt = () => new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
$('pExp').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; const l = linhasImportacao();
  if (!l.length) { toast('Nenhum preço aceito para importar'); return; }
  if (b.id === 'eXls') { if (!window.XLSX) { toast('Biblioteca de Excel indisponível'); return; }
    const ws = XLSX.utils.aoa_to_sheet([CAB, ...l]), wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Importacao');
    XLSX.writeFile(wb, `PriceSense_Regular_PRICE_${hojeTxt()}.xlsx`); toast(nf0.format(l.length) + ' linhas no Excel'); }
  if (b.id === 'eCopy') { try { await navigator.clipboard.writeText(l.map(r => r.join('\t')).join('\n')); b.classList.add('ok'); setTimeout(() => b.classList.remove('ok'), 1800); toast(nf0.format(l.length) + ' linhas copiadas'); }
    catch (err) { toast('Não foi possível copiar; use o Excel'); } }
});
$('bRnd').onclick = () => { montaRnd(); abrir('pRnd'); };
$('bPiso').onclick = () => { montaPiso(); abrir('pPiso'); };
$('bExp').onclick = () => { if (!$('pExp').innerHTML) montaExp(); abrir('pExp'); };

/* ---------- ações ---------- */
function atualizar(refiltrar = true){ kpis(); if (refiltrar) filtrar(); render(); }
$('q').addEventListener('input', e => { F.q = e.target.value; clearTimeout(e.target._t); e.target._t = setTimeout(() => { filtrar(); sc.scrollTop = 0; render(); }, 150); });
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { const v = +b.dataset.rg; F.travas.has(v) ? F.travas.delete(v) : F.travas.add(v); b.classList.toggle('on'); filtrar(); sc.scrollTop = 0; render(); }));
$('bAll').onclick = () => { let n = 0; for (const i of VIS) if (MUD[i] && !aceito(i)) { ACE.set(i, true); n++; } salvar(); atualizar(false); if (SEL >= 0) lateral(SEL); toast(n ? `${nf0.format(n)} preços aceitos` : 'Itens filtrados já estão aceitos'); };
$('bNone').onclick = () => { let n = 0; for (const i of VIS) if (MUD[i] && aceito(i)) { ACE.set(i, false); n++; } salvar(); atualizar(false); if (SEL >= 0) lateral(SEL); toast(`${nf0.format(n)} aceites retirados`); };
$('bReset').onclick = () => { if (!OV.size && !OVA.size && !ACE.size) { toast('Não há ajustes manuais'); return; } OV.clear(); OVA.clear(); ACE.clear(); calcTudo(); salvar(); atualizar(); if (SEL >= 0) lateral(SEL); toast('Preços e aceites voltaram à sugestão do motor'); };
$('bFoco').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().then(() => {}).catch(() => { document.body.classList.toggle('foco'); render(); }); };
document.addEventListener('fullscreenchange', () => { const fs = !!document.fullscreenElement; document.body.classList.toggle('fs', fs); document.body.classList.toggle('foco', fs); $('bFoco').classList.toggle('on', fs); render(); });
addEventListener('resize', () => render());

const comPesq = D.orig.some(o => o === 0);
$('escopo').textContent = `${nf0.format(N)} itens ${comPesq ? 'com pesquisa' : 'sem pesquisa'}, ${D.filiais.length} filiais, ${nf0.format(D.produtos.length)} produtos. ${D.pobj.filter(v => v != null).length ? nf0.format(D.pobj.filter(v => v != null).length) + ' com regra do Profimetrics.' : 'Sem regras do Profimetrics: margem objetiva 10% e máxima 30%.'}`;
calcTudo(); filtrar(); kpis();
if (VIS.length) selecionar(VIS[0]); else { render(); lateral(-1); historico(-1); }
})();
</script></body></html>
